{% extends 'base.html' %}

{% block title %}Iniciar sesión | ENI{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-75">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="fluent-card">
                <div class="mb-4">
                    <span class="sena-chip mb-3">Acceso institucional</span>
                    <h1 class="h2 mb-2">Iniciar sesión</h1>
                    <p class="text-lead mb-0">Ingresa para gestionar las convocatorias de capacitación.</p>
                </div>

                {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                <form method="post" class="vstack gap-3">
                    {% csrf_token %}
                    <div>
                        <label class="form-label fw-semibold" for="username">Usuario</label>
                        <input class="form-control sena-input" id="username" name="username" type="text" autocomplete="username" required>
                    </div>
                    <div>
                        <label class="form-label fw-semibold" for="password">Contraseña</label>
                        <input class="form-control sena-input" id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <button class="sena-btn sena-btn-primary w-100 mt-2" type="submit">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
